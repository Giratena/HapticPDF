<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HapticPDF</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Landing / file picker screen -->
  <div id="landing">
    <div class="landing-card">
      <h1>HapticPDF</h1>
      <p>Open a PDF or a folder of images to start reading.</p>
      <div class="open-buttons">
        <button class="btn" id="btn-open-pdf">📄 Open PDF</button>
        <button class="btn" id="btn-open-folder">📁 Open Folder</button>
        <button class="btn" id="btn-open-zip">📦 Open ZIP</button>
      </div>
    </div>
  </div>

  <!-- Viewer screen -->
  <div id="viewer" class="hidden">

    <!-- Top bar -->
    <div id="topbar">
      <button id="btn-back" title="Back to file picker">← Back</button>
      <span id="page-info">Page 1 / 1</span>
      <div id="topbar-right">
        <button id="btn-edit" title="Toggle edit mode (draw regions)">✏️ Edit</button>
        <button id="btn-config" title="Global settings">⚙️ Config</button>
        <button id="btn-funscript" title="Open Funscript Editor">🎵 Funscript</button>
        <button id="btn-fullscreen" title="Toggle fullscreen (F)">⛶ Fullscreen</button>
      </div>
    </div>

    <!-- Page display area -->
    <div id="stage">

      <!-- Content: canvas (PDF) or img (images) + region overlay -->
      <div id="content-wrap">
        <div id="page-inner">
          <canvas id="pdf-canvas" class="hidden"></canvas>
          <img id="img-display" class="hidden" alt="Comic page" />
          <!-- Region overlay: circles drawn here in edit mode -->
          <svg id="region-overlay" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
      </div>

      <!-- Debug hover label (non-edit mode) -->
      <div id="debug-hover" class="hidden"></div>

      <!-- Edit sidebar (slides in from right when a region is selected) -->
      <div id="edit-sidebar">
        <div class="sidebar-header">
          <span class="sidebar-title">Region</span>
          <button id="sidebar-close" title="Close">✕</button>
        </div>
        <div class="sidebar-body">
          <label class="sidebar-label" for="region-name-input">Name</label>
          <input id="region-name-input" type="text" class="sidebar-input" placeholder="Region name…" />
          <label class="sidebar-label" for="region-script-input">Script</label>
          <input id="region-script-input" type="text" class="sidebar-input" placeholder="EDI script name…" />
          <select id="region-script-select" class="sidebar-input hidden"></select>
          <label class="sidebar-label" for="region-priority-input">Priority</label>
          <input id="region-priority-input" type="number" class="sidebar-input" min="1" step="1" placeholder="1" />
          <button id="sidebar-bring-top" class="sidebar-action-btn">⬆ Bring to Top</button>
          <button id="sidebar-resize" class="sidebar-action-btn">↔ Resize</button>
          <button id="sidebar-delete" class="sidebar-delete-btn">🗑 Delete Region</button>
        </div>
      </div>

      <!-- Config sidebar (slides in from right when Config button is clicked) -->
      <div id="config-sidebar">
        <div class="sidebar-header">
          <span class="sidebar-title">Settings</span>
          <button id="config-sidebar-close" title="Close">✕</button>
        </div>
        <div class="sidebar-body">
          <span class="sidebar-label">Reading Direction</span>
          <div class="config-toggle-row">
            <label class="config-toggle-switch">
              <input type="checkbox" id="config-rtl-toggle" />
              <span class="config-toggle-track"></span>
            </label>
            <span class="config-toggle-label">LTR (Left → Right)</span>
          </div>
          <label class="sidebar-label" for="config-filler-script">Filler Script</label>
          <input id="config-filler-script" type="text" class="sidebar-input" placeholder="Script when no region hovered…" />
          <select id="config-filler-script-select" class="sidebar-input hidden"></select>
          <label class="sidebar-label" for="config-edi-host">EDI Host</label>
          <input id="config-edi-host" type="text" class="sidebar-input" placeholder="127.0.0.1" />
          <label class="sidebar-label" for="config-edi-port">EDI Port</label>
          <input id="config-edi-port" type="number" class="sidebar-input" placeholder="5000" min="1" max="65535" />
          <span class="sidebar-label">Region Feedback</span>
          <div class="config-toggle-row">
            <label class="config-toggle-switch">
              <input type="checkbox" id="config-region-feedback-toggle" checked />
              <span class="config-toggle-track"></span>
            </label>
            <span class="config-toggle-label">Visible</span>
          </div>
          <label class="sidebar-label" for="config-zoom-mode">Zoom to Fit</label>
          <select id="config-zoom-mode" class="sidebar-input">
            <option value="fit-page">Fit Page</option>
            <option value="fit-width">Fit Width</option>
            <option value="actual-size">Actual Size</option>
          </select>
          <span class="sidebar-label">Script Definitions</span>
          <div class="config-toggle-row">
            <button id="config-import-csv" class="sidebar-action-btn">📂 Import CSV</button>
            <button id="config-clear-csv" class="sidebar-action-btn">✕ Clear</button>
          </div>
          <span id="config-csv-status" class="config-csv-status"></span>
        </div>
      </div>
    </div>

    <!-- Funscript editor panel (full-viewport overlay, hidden by default) -->
    <div id="funscript-panel" class="hidden">
      <div id="funscript-panel-header">
        <span id="funscript-panel-title">🎵 Funscript Editor</span>
        <button id="btn-funscript-close" title="Close">✕ Close</button>
      </div>
      <div id="funscript-panel-body">
        <funscript-editor id="main-funscript-editor" filename="output.funscript"></funscript-editor>
      </div>
    </div>

    <!-- Bottom nav -->
    <div id="bottombar">
      <button id="btn-prev" title="Previous (← arrow key)">&#8592;</button>
      <span id="page-info-bottom">Page 1 / 1</span>
      <button id="btn-next" title="Next (→ arrow key)">&#8594;</button>
      <div id="zoom-controls">
        <button id="btn-zoom-out" title="Zoom out (Ctrl+-)">−</button>
        <span id="zoom-level">100%</span>
        <button id="btn-zoom-in" title="Zoom in (Ctrl++)">+</button>
      </div>
    </div>

  </div>

  <!-- PDF.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- JSZip from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- Page cache / preloader (must load before app.js) -->
  <script src="PageCache.js"></script>
  <!-- Region logic (must load before app.js) -->
  <script src="regions.js"></script>
  <!-- Config logic (must load before app.js) -->
  <script src="config.js"></script>
  <!-- Script definitions CSV import (must load after config.js, before app.js) -->
  <script src="ScriptDefinitions.js"></script>
  <!-- ZIP loader (must load before app.js) -->
  <script src="ZipLoader.js"></script>
  <!-- EDI API integration (must load after config.js, before app.js) -->
  <script src="Edi.js"></script>
  <!-- Funscript editor web component -->
  <script type="module" src="funscript/funscript-editor.js"></script>
  <script src="app.js"></script>
</body>
</html>
